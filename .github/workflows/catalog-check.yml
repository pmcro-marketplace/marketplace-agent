name: PMCR-O Marketplace Checker
on:
  pull_request:
  push:
    branches: [main, pmcro/standalone-production]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  catalog:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - run: python3 -B -m unittest discover -s tests -v
      - uses: ./.github/actions/catalog-check
